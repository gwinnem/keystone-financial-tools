name: CI

# Runs on every push to main or dev and on every pull request into them.
# Branch flow: work happens on `dev`; a pull request dev -> main runs this workflow before the merge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Angular 22, jsdom 30 and lint-staged 17 need Node 22.22+ or 24.15+; CI uses Node 24 (LTS).
  NODE_VERSION: '24'
  # `prepare` runs `husky`, which installs git hooks. Pointless in CI.
  HUSKY: '0'

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # The version comes from the root package.json "packageManager" field. pnpm 12 needs action-setup 6.1+.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (all packages)
        run: pnpm type-check

      - name: Lint (all packages)
        run: pnpm lint

      - name: Parity and messages (all packages)
        # Every export of the core is in the Vue, React and Angular packages unless the allow-list says otherwise (FR-FW-050), and no text
        # the user sees is written outside the message table (NFR-I18N-001). The same tests run in the unit tests below; they read the
        # source of every package, which a cached unit test run of one package would not notice changing, so they run here uncached.
        run: pnpm --filter keystone-financial-tools-typescript test:parity

      - name: Unit tests (with 90% coverage gates)
        run: pnpm test:coverage

      - name: Build all packages
        # Includes the docs site (packages/docs): its links validator fails the build on a broken link.
        run: pnpm build

      - name: Package sizes (NFR-SIZE-001)
        # The core is at most 25 kB min+gzip and each framework package at most 3 kB, measured on the files the build just wrote.
        run: pnpm --filter keystone-financial-tools-budgets size:check

  bench:
    name: Benchmarks (NFR-PERF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Benchmarks (core)
        # Writes packages/core/reports/bench/results.json.
        run: pnpm --filter keystone-financial-tools-core bench

      - name: Time budgets and baseline
        # Fails when a benchmark is over its time budget or more than 20% slower than packages/budgets/baseline/core-bench.json.
        run: pnpm --filter keystone-financial-tools-budgets bench:check

      - name: Upload benchmark results
        # The artifact is where a new baseline comes from, see packages/budgets/README.md.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: packages/core/reports/bench/results.json
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers (Chromium, Firefox, WebKit)
        run: pnpm --filter keystone-financial-tools-e2e test:e2e:install

      - name: End-to-end tests
        # Starts the playground (apps/playground) itself, see e2e/playwright.config.ts.
        run: pnpm --filter keystone-financial-tools-e2e test:e2e

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  mutation:
    name: Mutation (${{ matrix.package }})
    # Mutation testing is slow, so it only runs for changes headed to main: pull requests into main, and pushes to main.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [core, typescript, vue, react, angular, docs, budgets]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation tests (${{ matrix.package }})
        # One runner per package so the runs go in parallel. Config: packages/<package>/stryker.conf.json
        run: pnpm --filter keystone-financial-tools-${{ matrix.package }} test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore
